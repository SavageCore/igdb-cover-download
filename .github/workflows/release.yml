name: Build and Deploy
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 🛠️
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: 'pnpm'

      - name: Install and Build 🔧
        run: |
          pnpm install
          pnpm build

      - name: Create Release 🚀
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/igdb-cover-download.user.js
            dist/igdb-cover-download.meta.js
            LICENSE
          generate_release_notes: true
